<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="A seven-slide demonstration of SARstellar: NISAR and Sentinel-1 change detection, evidence and held-out validation.">
  <meta name="author" content="SARstellar team; presentation code and writing assisted by Claude and OpenAI Codex">
  <title>SARstellar — seven-slide project demonstration</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f1f3f4; color: #263139; font: 15px/1.5 Arial, sans-serif; }
    header, main, footer { max-width: 1280px; margin: auto; padding: 16px 24px; }
    header { display: flex; align-items: center; flex-wrap: wrap; justify-content: space-between; gap: 12px; }
    h1 { margin: 0; font-size: 18px; font-weight: 600; }
    a { color: #2f6589; text-underline-offset: 3px; }
    main { padding-top: 0; }
    figure { margin: 0; background: white; border: 1px solid #cfd4d8; }
    img { width: 100%; aspect-ratio: 16/9; max-height: calc(100dvh - 230px); object-fit: contain; display: block; }
    figcaption { padding: 10px 16px; border-top: 1px solid #cfd4d8; }
    .controls { margin-top: 16px; display: flex; align-items: center; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .pages { display: flex; gap: 6px; }
    button { min-width: 40px; min-height: 40px; padding: 8px 12px; border: 1px solid #aeb8bf; background: white; color: #263139; cursor: pointer; font: inherit; }
    button[aria-current="step"] { background: #2f6589; border-color: #2f6589; color: white; }
    button:disabled { opacity: .45; cursor: default; }
    :focus-visible { outline: 3px solid #2f6589; outline-offset: 3px; }
    footer { color: #5f6c75; font-size: 12px; }
    footer p { margin: 4px 0; }
    @media (max-width: 600px) { header, main, footer { padding: 12px; } .controls { gap: 6px; } .pages { gap: 3px; } button { padding: 6px; } }
  </style>
</head>
<body>
  <header>
    <h1>SARstellar project demonstration</h1>
    <a href="https://www.sarstellar.earth/">Open the application</a>
  </header>
  <main>
    <figure>
      <img id="slide" src="slide-1.png" alt="Two radars, one map: NISAR and Sentinel-1 change detections over the Kaiser Canyon Fire." width="1280" height="720">
      <figcaption id="caption" aria-live="polite">Slide 1 of 7 · Two radars, one map</figcaption>
    </figure>
    <nav class="controls" aria-label="Presentation slides">
      <button id="previous" type="button" disabled>Previous</button>
      <div class="pages">
        <button type="button" data-slide="0" aria-current="step" aria-label="Slide 1">1</button>
        <button type="button" data-slide="1" aria-label="Slide 2">2</button>
        <button type="button" data-slide="2" aria-label="Slide 3">3</button>
        <button type="button" data-slide="3" aria-label="Slide 4">4</button>
        <button type="button" data-slide="4" aria-label="Slide 5">5</button>
        <button type="button" data-slide="5" aria-label="Slide 6">6</button>
        <button type="button" data-slide="6" aria-label="Slide 7">7</button>
      </div>
      <button id="next" type="button">Next</button>
    </nav>
  </main>
  <footer>
    <p><a href="sarstellar-presentation.pptx" download>Download the seven-slide presentation (.pptx)</a> · <a href="https://www.sarstellar.earth/#/scorecard">Benchmark</a> · <a href="https://www.sarstellar.earth/#/about">Methods and sources</a></p>
    <p>Claude and OpenAI Codex assisted with code and writing. Radar maps derive from satellite data. Cause labels are hypotheses for independent verification.</p>
  </footer>
  <script>
    const titles = ["Two radars, one map", "Draw a box, get evidence", "Kaiser Canyon Fire", "Statistics first", "A fair held-out test", "Specialists, not a team", "Try it"];
    const descriptions = [
      "Two radars, one map. NISAR now images nearly all of Earth's land every 12 days; Sentinel-1 has done so for a decade. Which radar should you trust for which change? Image: Kaiser Canyon Fire with NISAR, Sentinel-1 and shared detections.",
      "Screenshot of the SARstellar map. Steps: pick a US box up to 20 km a side or an example; compare NISAR L-band and Sentinel-1 C-band on one 1-hectare grid; inspect what changed, when, the likely cause, and which radar to trust for that kind of change; export GeoTIFF, CSV and a notebook.",
      "Kaiser Canyon Fire, Colville Reservation: 1,764 hectares classified as burn; NISAR HV fell 2.8 dB in the largest burn patch, inside the mapped NIFC perimeter; census tracts at the 89th to 96th social-vulnerability percentile. Area totals use unequal date counts and are not an accuracy comparison.",
      "Pipeline: read NISAR GCOV and OPERA Sentinel-1 RTC; grid to 1-hectare blocks; Conradsen change test with FDR q 0.05 and at least 2 dB; group areas of 3 hectares or more; physics rules give a cause hypothesis with evidence. A language model only rewords evidence.",
      "Benchmark: 224 sites in 39 states, 164 for training and 60 held out in 12 states never used for tuning, 2.17 million one-hectare blocks, one image pair per radar. Map of training and held-out sites.",
      "Finding: the radars are specialists. For forest loss on held-out states NISAR precision was 31 percent versus 4 percent for Sentinel-1 at 50 percent recall, 7.8 times. Sentinel-1 led on open-water flood, whose reference partly uses Sentinel-1. Fisher and Bonferroni fusion never reliably beat the best single radar; for forest loss it was worse, AUPRC minus 0.07, 95 percent interval minus 0.16 to minus 0.01. False alarms on stable ground: NISAR 1.6 percent, Sentinel-1 3.4 percent, fused 4.3 percent.",
      "Limits: sites were chosen where change happened, only 3 held-out flood sites, causes are hypotheses, US boxes up to 20 km. Check our work: scorecard.json, story provenance, and notebook exports. Data credits: NASA/ISRO NISAR via ASF, NASA JPL OPERA, NIFC, USDA NASS CDL, USGS/MRLC NLCD, CDC/ATSDR SVI, Open-Meteo, Esri imagery."
    ];
    let current = 0;
    const slide = document.getElementById("slide");
    const caption = document.getElementById("caption");
    const previous = document.getElementById("previous");
    const next = document.getElementById("next");
    const buttons = [...document.querySelectorAll("[data-slide]")];
    function show(index) {
      current = Math.max(0, Math.min(titles.length - 1, index));
      slide.src = `slide-${current + 1}.png`;
      slide.alt = descriptions[current];
      caption.textContent = `Slide ${current + 1} of 7 · ${titles[current]}`;
      previous.disabled = current === 0;
      next.disabled = current === titles.length - 1;
      buttons.forEach((button, i) => i === current ? button.setAttribute("aria-current", "step") : button.removeAttribute("aria-current"));
    }
    previous.addEventListener("click", () => show(current - 1));
    next.addEventListener("click", () => show(current + 1));
    buttons.forEach((button) => button.addEventListener("click", () => show(Number(button.dataset.slide))));
    document.addEventListener("keydown", (event) => {
      if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
      if (event.key === "ArrowRight") { event.preventDefault(); show(current + 1); }
      if (event.key === "ArrowLeft") { event.preventDefault(); show(current - 1); }
    });
  </script>
</body>
</html>
